<section class="page">
  <vc-heading [level]="2">Formularios</vc-heading>
  <vc-text [muted]="true">
    Campos com estados de hint e error para validar o padrao visual.
  </vc-text>

  <div class="page__grid">
    <vc-input label="Nome completo" placeholder="Digite o nome"></vc-input>
    <vc-email-input label="E-mail"></vc-email-input>
    <vc-phone-input label="Telefone" hint="Opcional"></vc-phone-input>
    <vc-input
      label="Senha"
      type="password"
      error="Senha fraca"
      mask="password"
    ></vc-input>
    <vc-input
      label="Data de admissao"
      placeholder="dd/mm/aaaa"
      mask="date"
    ></vc-input>
    <vc-date label="Data de nascimento" hint="Formato dd/mm/aaaa"></vc-date>
    <vc-date-time-input label="Data e hora do atendimento"></vc-date-time-input>
    <vc-postal-code-input label="CEP"></vc-postal-code-input>
    <div class="page__span">
      <vc-select
        label="Especialidade"
        placeholder="Selecione"
        [options]="specialties"
      ></vc-select>
    </div>
    <div class="page__span">
      <vc-search label="Buscar paciente" placeholder="Digite para buscar"></vc-search>
    </div>
  </div>
</section>
