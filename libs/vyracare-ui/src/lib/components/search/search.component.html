<div class="vc-search">
  @if (label) {
    <label class="vc-label" [attr.for]="id">{{ label }}</label>
  }
  <div class="vc-search__row">
    <div class="vc-search__field">
      @if (!action) {
        <vc-icon name="search" size="sm" [decorative]="true"></vc-icon>
      }
      <input
        class="vc-search__input"
        [class.vc-search__input--action]="action"
        [id]="id"
        type="search"
        [attr.placeholder]="placeholder"
        [disabled]="disabled"
        [value]="value"
        [class.invalid]="!!error"
        (input)="handleInput($event)"
        (keyup.enter)="submit()"
        (blur)="markTouched()"
      />
    </div>
    @if (action) {
      <button class="vc-search__action" type="button" [disabled]="disabled" [attr.aria-label]="actionLabel" (click)="submit()">
        <vc-icon name="search" size="sm" [decorative]="true"></vc-icon>
      </button>
    }
  </div>
  @if (hint && !error) {
    <small class="vc-search__hint">{{ hint }}</small>
  }
  @if (error) {
    <small class="vc-search__error">{{ error }}</small>
  }
</div>
