<span
  #trigger
  class="vc-tooltip-trigger"
  (mouseenter)="show()"
  (mouseleave)="hide()"
  (focusin)="show()"
  (focusout)="hide()"
>
  <ng-content></ng-content>
  @if (visible()) {
    <span
      class="vc-tooltip"
      [class]="'vc-tooltip vc-tooltip--' + position"
      [id]="tooltipId"
      [style.left.px]="coordinates().left"
      [style.top.px]="coordinates().top"
      role="tooltip"
    >{{ text }}</span>
  }
</span>
