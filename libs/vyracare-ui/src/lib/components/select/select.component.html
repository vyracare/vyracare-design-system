<div class="vc-select">
  @if (label) {
    <label class="vc-label" [attr.for]="id">
      <span>{{ label }}</span>
      @if (required) {
        <span class="vc-label__required">*</span>
      }
    </label>
  }
  <div class="vc-select__field" (focusout)="markTouched()">
    <button
      class="vc-select__trigger"
      type="button"
      role="combobox"
      [id]="id"
      [disabled]="disabled"
      [class.invalid]="!!error"
      [class.placeholder]="!value"
      [attr.aria-expanded]="open"
      [attr.aria-controls]="id + '-options'"
      (click)="toggle()"
    >{{ selectedLabel }}</button>
    <vc-icon name="chevron-down" size="sm" [decorative]="true"></vc-icon>
    @if (open) {
      <div class="vc-select__options" [id]="id + '-options'" role="listbox">
        @for (option of options; track option.value) {
          <button type="button" role="option" [disabled]="option.disabled" [attr.aria-selected]="option.value === value" (mousedown)="$event.preventDefault()" (click)="selectOption(option.value, !!option.disabled)">{{ option.label }}</button>
        }
      </div>
    }
  </div>
  @if (hint && !error) {
    <small class="vc-select__hint">{{ hint }}</small>
  }
  @if (error) {
    <small class="vc-select__error">{{ error }}</small>
  }
</div>
