<aside class="vc-sidebar">
  @for (group of groups; track group.label) {
    <div class="vc-sidebar__group">
      <p class="vc-sidebar__label">{{ group.label }}</p>

      @for (item of group.items; track item.id) {
        <button
          type="button"
          class="vc-sidebar__item"
          [class.is-active]="isActive(item)"
          [attr.aria-expanded]="hasChildren(item) ? isExpanded(item) : null"
          (click)="selectItem(item)"
        >
          @if (item.icon) {
            <vc-icon [name]="item.icon" size="sm" [decorative]="true"></vc-icon>
          }
          <span>{{ item.label }}</span>
          @if (hasChildren(item)) {
            <vc-icon class="vc-sidebar__chevron" [name]="isExpanded(item) ? 'chevron-up' : 'chevron-down'" size="sm" [decorative]="true"></vc-icon>
          }
        </button>

        @if (hasChildren(item) && isExpanded(item)) {
          <div class="vc-sidebar__submenu">
            @for (child of item.children; track child.id) {
              <button type="button" class="vc-sidebar__subitem" [class.is-active]="isActive(child)" (click)="selectItem(child)">
                @if (child.icon) {<vc-icon [name]="child.icon" size="sm" [decorative]="true"></vc-icon>}
                <span>{{ child.label }}</span>
              </button>
            }
          </div>
        }
      }
    </div>
  }

  @if (support) {
    <div class="vc-sidebar__support">
      <strong>{{ support.title }}</strong>
      <p>{{ support.description }}</p>
      <a [href]="support.linkHref">{{ support.linkLabel }}</a>
    </div>
  }
</aside>
