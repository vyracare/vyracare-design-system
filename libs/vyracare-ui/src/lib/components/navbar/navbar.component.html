<header class="vc-navbar">
  @if (logoClickable) {
    <button
      type="button"
      class="vc-navbar__logo-area vc-navbar__logo-area--button"
      [attr.aria-label]="logoAriaLabel"
      (click)="handleLogoClick()"
    >
      <span class="vc-navbar__logo-mark">{{ brandLabel }}<span>{{ brandAccent }}</span></span>
      <p>{{ brandSubtitle }}</p>
    </button>
  } @else {
    <div class="vc-navbar__logo-area">
      <span class="vc-navbar__logo-mark">{{ brandLabel }}<span>{{ brandAccent }}</span></span>
      <p>{{ brandSubtitle }}</p>
    </div>
  }

  <div class="vc-navbar__search" (click)="$event.stopPropagation()">
    <label class="vc-navbar__search-field">
      <vc-icon name="search" size="md" [decorative]="true"></vc-icon>
      <input
        type="search"
        role="combobox"
        aria-autocomplete="list"
        aria-controls="vc-navbar-search-suggestions"
        [attr.aria-expanded]="searchSuggestionsOpen"
        [attr.aria-activedescendant]="activeSuggestionIndex() >= 0 ? 'vc-navbar-search-suggestion-' + activeSuggestionIndex() : null"
        [value]="searchValue"
        [placeholder]="searchPlaceholder"
        (focus)="openSearchSuggestions()"
        (input)="handleSearch($event)"
        (keydown)="handleSearchKeydown($event)"
      />
    </label>

    @if (searchSuggestionsOpen) {
      <div id="vc-navbar-search-suggestions" class="vc-navbar__search-suggestions" role="listbox">
        @for (suggestion of searchSuggestions; track suggestion.id; let index = $index) {
          <button
            type="button"
            role="option"
            class="vc-navbar__search-suggestion"
            [class.is-active]="activeSuggestionIndex() === index"
            [attr.id]="'vc-navbar-search-suggestion-' + index"
            [attr.aria-selected]="activeSuggestionIndex() === index"
            (click)="selectSearchSuggestion(suggestion)"
          >
            @if (suggestion.icon) {
              <vc-icon [name]="suggestion.icon" size="md" [decorative]="true"></vc-icon>
            }
            <span>
              <strong>{{ suggestion.label }}</strong>
              @if (suggestion.description) {
                <small>{{ suggestion.description }}</small>
              }
            </span>
            <vc-icon name="arrow-right" size="sm" [decorative]="true"></vc-icon>
          </button>
        }
      </div>
    }
  </div>

  <vc-notifications
    [items]="notifications"
    (itemSelected)="notificationSelected.emit($event)"
    (viewAll)="viewAllNotifications.emit()"
  ></vc-notifications>

  <div class="vc-navbar__profile" (click)="$event.stopPropagation()">
    <vc-avatar
      [initials]="profileInitials"
      [name]="profileName"
      [imageUrl]="profileImageUrl"
    ></vc-avatar>

    <div class="vc-navbar__profile-text">
      <strong>{{ profileName }}</strong>
      <small>{{ profileRole }}</small>
    </div>

    <vc-icon-button
      [icon]="profileMenuOpen() ? 'chevron-up' : 'chevron-down'"
      ariaLabel="Abrir menu do perfil"
      variant="soft"
      size="md"
      [active]="profileMenuOpen()"
      (action)="toggleProfileMenu($event)"
    ></vc-icon-button>

    <div class="vc-navbar__profile-dropdown" [class.open]="profileMenuOpen()">
      @for (action of profileActions; track action.id) {
        <button type="button" (click)="selectProfileAction(action, $event)">
          {{ action.label }}
        </button>
      }
    </div>
  </div>
</header>
